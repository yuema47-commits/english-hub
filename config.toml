[menu]
  [[menu.main]]
    name = "Home"
    url = "/"
    weight = 1
  [[menu.main]]
    name = "学习方法"
    url = "/methods/"
    weight = 2
  [[menu.main]]
    name = "阅读材料"
    url = "/reading/"
    weight = 3
  [[menu.main]]
    name = "听力练习"
    url = "/listening/"
    weight = 4

[outputs]
  home = ["HTML", "RSS"]

[markup.goldmark.renderer]
  unsafe = true
